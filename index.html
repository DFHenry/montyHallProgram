<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Monty Hall Problem</title>
</head>
<body>

    <h1>The Monty Hall Problem</h1>

    <script>
        var car;
        var choice;
        var remove;

        var switchCounter = 0;
        var stayCounter = 0;

        var switchPercentage;
        var stayPercentage;
        
        for(var i = 0; i < 10000; i++)
        {
            car = Math.ceil(Math.random() * 3);
            document.write("<p>The car is behind door number " + car + "</p>");

            choice = Math.ceil(Math.random() *3);
            document.write("<p>The contestant chooses door number " + choice + "</p>");

            remove = Math.ceil(Math.random() *3);

            do
            {
                remove = Math.ceil(Math.random() *3);
            }
            while(remove == car || remove == choice);

            document.write("<p>The host reveals door number " + remove + " to be a bad choice</p>");

            if(choice == car)
            {
                stayCounter += 1;
                document.write("<p style='color:green;'>The contestant should stay.</p>");
            }
            else
            {
                switchCounter += 1;
                document.write("<p style='color:red;'>The contestant should switch.</p>");
            }

            document.write("<hr>");
        }

        console.log("switched: " + switchCounter);
        console.log("stayed: " + stayCounter);

        switchPercentage = switchCounter / 10000 * 100;
        console.log(switchPercentage);

        /*stayPercentage = stayCounter / 1000 * 100;
        console.log(stayPercentage);*/

    </script>
    
</body>
</html>
